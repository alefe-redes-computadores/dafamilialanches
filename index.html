<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍔 Da Família Lanches</title>

  <!-- CSS crítico leve para evitar layout "quebrando" antes do CSS principal -->
  <style>
    /* CSS CRÍTICO DFL v3.6.7 */
    body{background:#ffd54f;font-family:"Inter","Poppins",sans-serif;color:#222;margin:0;scroll-behavior:smooth}
    .header{display:flex;justify-content:space-between;align-items:center;background:#ffca28;padding:10px 16px;box-shadow:0 2px 5px rgba(0,0,0,.15);position:fixed;top:0;left:0;right:0;z-index:900}
    .header-content{display:flex;align-items:center;gap:12px}
    .logo{width:52px;height:52px}
    .header-info h1{margin:0;font-size:1.2rem}
    .tagline{margin:0;font-size:.85rem;color:#d84315}
    .header-actions{display:flex;align-items:center;gap:10px}
    .main-content-wrapper{padding-top:72px}
    .user-button{background:linear-gradient(135deg,#fff,#f7f7f7);border:1px solid #ddd;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;transition:.2s}
    #cart-icon,.cart-button{background:#ffb300;border:none;border-radius:8px;padding:8px 12px;font-weight:700;cursor:pointer;transition:.2s}
    .status-banner{text-align:center;padding:8px;color:#fff;font-weight:600}
    .status-banner.open{background:#4caf50}
    .status-banner.closed{background:#d32f2f}
    .hours-banner{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:#000;color:#fff;font-size:.9rem;overflow:hidden;white-space:nowrap}
    .promo-section{text-align:center;padding:20px 10px}
    .promo-section h2{color:#ff5722;margin-bottom:8px}
    .promo-sub{color:#666;margin-bottom:10px;font-size:.95rem}
    .countdown-ticker{background:#fff;display:inline-block;padding:6px 12px;border-radius:10px;margin:8px 0 15px;font-weight:600;box-shadow:0 2px 5px rgba(0,0,0,.1)}
    @media (max-width:600px){.hours-banner{padding:8px 10px;font-size:.85rem}}
  </style>

  <!-- CSS principal (carregado de forma não-bloqueante) -->
  <link rel="stylesheet" href="style.css?v=2.11" media="print" onload="this.media='all'"/>

  <!-- Preloads (perf) -->
  <link rel="preload" as="image" href="imagens/bitela.png">

  <!-- Firebase -->
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

  <header class="header">
    <div class="header-content">
      <img src="logo.png" alt="Logo DFL" class="logo" width="48" height="48"/>
      <div class="header-info">
        <h1>Da Família Lanches</h1>
        <p class="tagline">Aqui o sabor é de casa ❤️</p>
      </div>
    </div>

    <div class="header-actions">
      <button id="reports-btn" class="user-button" style="display:none;">Relatórios</button>
      <button id="user-btn" class="user-button" type="button">Entrar / Cadastrar</button>
      <button id="cart-icon" class="cart-button" type="button" aria-label="Ver carrinho de compras">
        🛒 <span id="cart-count">0</span>
      </button>
    </div>
  </header>

  <div class="main-content-wrapper">

    <div id="status-banner" class="status-banner"></div>
    <div class="hours-banner">
      ⏰ Hoje atendemos até <b>23h30</b> — Faltam <span id="timer"></span>
    </div>

    <section class="promo-section">
      <h2>🔥 Promoções do Dia</h2>
      <p class="promo-sub">Aproveite antes que acabe!</p>
      <div class="countdown-ticker">
        ⏳ Tempo restante: <span id="promo-timer"></span>
      </div>

      <div class="carousel">
        <button class="c-btn c-prev" type="button" aria-label="Anterior">‹</button>
        <div class="slides">
          <img class="slide" src="promocoes/promo1.jpg" width="300" height="200"/>
          <img class="slide" src="promocoes/promo2.jpg" width="300" height="200"/>
          <img class="slide" src="promocoes/promo3.jpg" width="300" height="200"/>
        </div>
        <button class="c-btn c-next" type="button" aria-label="Próximo">›</button>
      </div>
    </section>

    <div id="cart-backdrop"></div>
    <aside id="mini-cart" class="mini-cart">
      <div class="mini-head">
        <h3>🛍 Seu Pedido</h3>
        <button class="extras-close" type="button">✖</button>
      </div>
      <div class="mini-list"></div>
    </aside>

    <footer class="footer">
      <p>📍 Rua dos Caiçaras, 212 — Patos de Minas/MG</p>
    </footer>

  </div>

  <!-- 🔧 Scripts principais (versão compatível com celular) -->
  <script defer src="js/cart.js?v=3.6.7"></script>
  <script defer src="js/rewards.js?v=3.6.7"></script>
  <script defer src="js/admin.js?v=3.6.7"></script>
  <script defer src="js/core.js?v=3.6.7"></script>
</body>
</html>
