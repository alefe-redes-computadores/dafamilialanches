<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Da Família Lanches - v5.5</title>

    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    />

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="style.css?v=5.5" />

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
</head>

<body>

    <!-- HEADER -->
    <header class="main-header">
        <div class="header-left">
            <img src="public/img/logo-dfl.png" class="logo" alt="DFL" />
            <span class="header-title">Da Família Lanches</span>
        </div>

        <div class="header-right">
            <button id="openCartBtn" class="icon-btn">
                🛒
            </button>

            <button id="openProfileBtn" class="icon-btn">
                👤
            </button>
        </div>
    </header>

    <!-- =============================== -->
    <!-- 🚀 BARRA DE PROGRESSO v5.5 (OPÇÃO B) -->
    <!-- =============================== -->

    <section class="progress-container">
        <div class="progress-steps">
            <div class="step-item">
                <div class="step-icon" id="stepCart">🛒</div>
                <span class="step-label">Carrinho</span>
            </div>

            <div class="step-separator"></div>

            <div class="step-item">
                <div class="step-icon" id="stepAddress">📍</div>
                <span class="step-label">Endereço</span>
            </div>

            <div class="step-separator"></div>

            <div class="step-item">
                <div class="step-icon" id="stepPayment">💳</div>
                <span class="step-label">Pagamento</span>
            </div>

            <div class="step-separator"></div>

            <div class="step-item">
                <div class="step-icon" id="stepFinish">✔️</div>
                <span class="step-label">Finalização</span>
            </div>
        </div>

        <div class="progress-bar-wrapper">
            <div id="mainProgressBar" class="progress-bar"></div>
        </div>
    </section>

    <!-- STATUS BANNER -->
    <div id="status-banner" class="status-banner">
        ⏳ Carregando status da loja...
    </div>

    <!-- CONTEÚDO PRINCIPAL -->
    <main id="app">

        <!-- CARROSSEL -->
        <section class="home-carousel">
            <div class="carousel-item">
                <img src="public/img/banner1.png" alt="Promoção 1" />
            </div>
            <div class="carousel-item">
                <img src="public/img/banner2.png" alt="Promoção 2" />
            </div>
        </section>

        <!-- CARDÁPIO -->
        <section class="menu-section">
            <h2 class="menu-title">Cardápio</h2>

            <div id="menuList" class="menu-list">
                <!-- Produtos do Firestore entram aqui -->
            </div>
        </section>
<!-- FIM DO CARDÁPIO E INÍCIO DOS PAINÉIS -->
        
        <!-- MINI-CARRINHO -->
        <aside id="miniCart" class="mini-cart hidden">

            <div class="mini-cart-header">
                <h3>🛒 Meu Carrinho</h3>
                <button id="closeMiniCartBtn" class="close-btn">✖</button>
            </div>

            <div id="miniCartList" class="mini-cart-list">
                <!-- Itens do carrinho aparecem aqui -->
            </div>

            <!-- ============================ -->
            <!-- 🚀 BARRA DE PROGRESSO DO FRETE (mini-carrinho) -->
            <!-- ============================ -->
            <div class="frete-progress-area">
                <div id="frete-progress-bar"></div>
                <p id="frete-progress-text"></p>
            </div>

            <!-- RESUMO DO CARRINHO -->
            <div class="mini-foot-summary">

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="miniSubtotal">R$ 0,00</span>
                </div>

                <div class="summary-row">
                    <span>Entrega</span>
                    <span id="miniDeliveryFee">R$ 0,00</span>
                </div>

                <div class="summary-row total-row">
                    <strong>Total</strong>
                    <strong id="miniTotal">R$ 0,00</strong>
                </div>

                <button id="finishOrderBtn" class="finish-btn">
                    Finalizar Pedido
                </button>
            </div>

        </aside>

        <!-- MODAL LOGIN -->
        <div id="loginModal" class="modal hidden">
            <div class="modal-content">
                <h2>Entrar</h2>

                <button id="googleLoginBtn" class="google-btn">
                    Entrar com Google
                </button>

                <button id="emailLoginBtn" class="email-btn">
                    Entrar com E-mail
                </button>

                <button class="close-btn" id="closeLoginModal">✖</button>
            </div>
        </div>

        <!-- MODAL ADICIONAIS -->
        <div id="extrasModal" class="modal hidden">
            <div class="modal-content">

                <h2>Adicionais</h2>

                <div id="extrasList" class="extras-list">
                    <!-- Adicionais via JS -->
                </div>

                <button id="extrasConfirmBtn" class="confirm-btn">
                    Confirmar
                </button>

                <button id="closeExtrasModal" class="close-btn">✖</button>
            </div>
        </div>

        <!-- MODAL MEUS PEDIDOS -->
        <div id="ordersModal" class="modal hidden">
            <div class="modal-content">

                <h2>📦 Meus Pedidos</h2>
                <div id="ordersList" class="orders-list">
                    <!-- Pedidos -->
                </div>

                <button id="closeOrdersModal" class="close-btn">✖</button>
            </div>
        </div>

        <!-- MODAL ENDEREÇO -->
        <div id="addressModal" class="modal hidden">
            <div class="modal-content">

                <h2>📍 Endereço de Entrega</h2>

                <!-- CEP Automático -->
                <label>CEP</label>
                <input type="text" id="cepInput" placeholder="Digite seu CEP" maxlength="9" />

                <button id="buscarCEPBtn" class="search-btn">Buscar CEP</button>

                <p class="cep-helper">
                    <span id="openCepManual" class="cep-manual-link">Preencher endereço manualmente</span>
                </p>

                <!-- ENDEREÇO RESULTADO -->
                <div id="autoAddressArea">
                    <label>Endereço</label>
                    <input type="text" id="addressFull" readonly />

                    <div class="two-fields">
                        <div>
                            <label>Número</label>
                            <input type="text" id="addressNumber" maxlength="6" />
                        </div>

                        <div>
                            <label>Complemento</label>
                            <input type="text" id="addressComplement" />
                        </div>
                    </div>
                </div>

                <!-- ENDEREÇO MANUAL -->
                <div id="manualAddressArea" class="hidden">
                    <label>Rua</label>
                    <input type="text" id="manualRua" />

                    <label>Bairro</label>
                    <input type="text" id="manualBairro" />

                    <label>Cidade</label>
                    <input type="text" id="manualCidade" value="Patos de Minas" />

                    <label>Estado</label>
                    <input type="text" id="manualEstado" value="MG" />

                    <button id="usarManualBtn" class="confirm-btn">
                        Usar este endereço
                    </button>
                </div>

                <button id="closeAddressModal" class="close-btn">✖</button>
            </div>
        </div>

    </main>

    <!-- SCRIPTS -->
    <script src="script.js?v=5.5"></script>

</body>
</html>
