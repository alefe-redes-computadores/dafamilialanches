<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Da Família Lanches</title>

    <!-- Ícones e Metas -->
    <link rel="icon" type="image/png" href="public/img/icon.png" />
    <meta name="theme-color" content="#FFD54F" />

    <!-- Estilos -->
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header id="header">
        <img src="public/img/logo-dfl.png" alt="Logo" class="logo-header" />
        <button id="open-cart" class="btn-cart-header">🛒</button>
        <button id="open-orders" class="btn-orders-header">📦</button>
        <button id="open-rewards" class="btn-rewards-header">🎁</button>
    </header>

    <main id="main-content">

        <!-- CARROSSEL -->
        <section id="carousel-container">
            <div id="carousel">
                <img src="public/img/banner1.jpg" alt="Banner 1" />
                <img src="public/img/banner2.jpg" alt="Banner 2" />
                <img src="public/img/banner3.jpg" alt="Banner 3" />
            </div>
        </section>

        <!-- MENU -->
        <section id="menu">
<h2 class="menu-title">Cardápio</h2>

            <div id="products-container">
                <!-- Os produtos são carregados dinamicamente pelo script.js -->
            </div>
        </section>

        <!-- MODAL DE LOGIN -->
        <div id="login-modal" class="modal hidden">
            <div class="modal-content">
                <h2>Entrar</h2>

                <button id="login-google" class="btn google-login">
                    Entrar com Google
                </button>

                <p class="or-divider">ou</p>

                <input type="email" id="login-email" placeholder="E-mail" />
                <input type="password" id="login-password" placeholder="Senha" />

                <button id="login-email-btn" class="btn primary">Entrar</button>

                <button class="close-modal">Fechar</button>
            </div>
        </div>

        <!-- MODAL DO CARRINHO -->
        <div id="cart-modal" class="modal hidden">
            <div class="modal-content cart-content">

                <h2>Seu Carrinho</h2>

                <div id="cart-items"></div>

                <div class="divider"></div>

                <!-- ENDEREÇO / VIA CEP -->
                <div class="address-block">

                    <label for="cep-input">CEP</label>
                    <div class="cep-row">
                        <input 
                            type="text"
                            id="cep-input"
                            maxlength="9"
                            placeholder="Digite seu CEP"
                        />
                        <button id="buscar-cep" class="btn small">Buscar</button>
                    </div>

                    <!-- 🔵 BOTÕES NOVOS -->
                    <button id="nao-sei-cep" class="btn-link blue">
                        🔵 Não sei meu CEP
                    </button>

                    <button id="manual-endereco" class="btn-link gray">
                        ✏️ Digitar endereço manualmente
                    </button>

                    <label for="endereco-auto">Endereço completo</label>
                    <input 
                        type="text" 
                        id="endereco-auto"
                        placeholder="Preenchido automaticamente pelo CEP"
                        readonly
                    />

                    <label for="numero-input">Número</label>
                    <input 
                        type="text" 
                        id="numero-input"
                        placeholder="Ex.: 123"
                        maxlength="6"
                    />

                    <label for="complemento-input">Complemento</label>
                    <input 
                        type="text"
                        id="complemento-input"
                        placeholder="Ex.: Apto 202"
                    />

                    <p id="frete-info" class="frete-info">
                        Frete grátis acima de R$ 80,00 até 5 km 🚀
                    </p>
                </div>

                <div class="divider"></div>

                <!-- TOTAIS -->
                <div id="cart-totals">
                    <p class="line">
                        <span>Subtotal:</span>
                        <strong id="subtotal">R$ 0,00</strong>
                    </p>

                    <p class="line">
                        <span>Entrega:</span>
                        <strong id="frete-total">R$ 0,00</strong>
                    </p>

                    <p class="line total">
                        <span>Total:</span>
                        <strong id="cart-final-total">R$ 0,00</strong>
                    </p>
                </div>

                <button id="finalizar-pedido" class="btn confirm">
                    Finalizar Pedido
                </button>

                <button class="close-modal">Fechar</button>
            </div>
        </div>


        <!-- MODAL MEUS PEDIDOS -->
        <div id="orders-modal" class="modal hidden">
            <div class="modal-content">
                <h2>📦 Meus Pedidos</h2>
                <div id="orders-list"></div>

                <button class="close-modal">Fechar</button>
            </div>
        </div>
<!-- MODAL RECOMPENSAS -->
        <div id="rewards-modal" class="modal hidden">
            <div class="modal-content">
                <h2>🎁 Minhas Recompensas</h2>

                <div id="rewards-list"></div>

                <button class="close-modal">Fechar</button>
            </div>
        </div>

    </main>

    <!-- FOOTER -->
    <footer id="footer">
        <p>© Da Família Lanches • Todos os direitos reservados</p>
    </footer>

    <!-- SCRIPTS -->
    <script src="extras.js"></script>
    <script src="script.js"></script>
</body>
</html>
